<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · JUROSpain</title><link rel="icon" href="/portal1/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/portal1/site.css">
</head><body class="gate">
<main class="gate-card">
  <img class="logo" src="/portal1/logo.png" alt="JUROSpain" style="height:42px;margin:0 auto 22px">
  <p class="kicker" style="text-align:center">Access</p>
  <h1 style="font-size:40px;text-align:center;margin:6px 0 18px">Sign in</h1>
  <form id="login">
    <button type="button" id="google" class="btn ghost" style="width:100%">Continue with Google</button>
    <p style="text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--faint);margin:14px 0">or email</p>
    <label><span class="lbl">Email</span><input name="email" type="email" autocomplete="email"></label>
    <label style="display:block;margin-top:10px"><span class="lbl">Password</span><input name="password" type="password" autocomplete="current-password"></label>
    <button class="btn" style="width:100%;margin-top:16px">Continue to payment</button>
  </form>
  <p class="muted" style="text-align:center;font-size:13px;margin-top:16px">Sign-in is not connected yet. Continuing opens payment. Nothing is charged.</p>
</main>
<script>
document.getElementById("login").onsubmit = function (e) { e.preventDefault(); location.href = "/portal1/plans/"; };
document.getElementById("google").onclick = function () { location.href = "/portal1/plans/"; };
</script>
</body></html>
